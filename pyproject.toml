[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend", "scripts"]
extend-exclude = [".venv", "frontend", "data"]

[tool.ruff.lint]
# Repo-wide static gate: syntax errors, undefined names, unused imports, empty f-strings, mutable defaults
select = ["E9", "F63", "F7", "F82", "F401", "F541", "B006"]
