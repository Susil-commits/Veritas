version: '3.8'

services:
  # In-memory distributed cache & session store
  redis:
    image: redis:7-alpine
    container_name: veritas-redis
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment or .env}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in environment or .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend Service (LangGraph, BKT, Symbolic CAS, Gemini API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veritas-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - UPSTASH_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - VERITAS_MCP_API_KEY=${VERITAS_MCP_API_KEY:-}
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # React + Vite Frontend (Nginx SPA proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veritas-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
