name: Veritas CI / Continuous Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend Startup Smoke & Guardrails Test
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "test"
      GEMINI_API_KEY: "ci-dummy-key"
      SUPABASE_URL: "https://dummy-test-project.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_service"
      SESSION_SECRET_KEY: "veritas_ci_test_secret_key_fixed_length_minimum_32_bytes!!"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify dependency resolution integrity
        run: |
          pip check

      - name: Run LangGraph compilation & FastAPI lifespan smoke test
        run: |
          python backend/test_startup_smoke.py

      - name: Run Platform Safety & Socratic Guardrails suite
        run: |
          python backend/test_safety.py

      - name: Run Deterministic Objective Math Evaluator
        run: |
          python backend/test_math_evaluator.py

      - name: Run Problem Turn Tracking & Attempt Isolation test
        run: |
          python backend/test_problem_turn_tracking.py

  frontend-validation:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Run linter (oxlint)
        run: |
          npm --prefix frontend run lint

      - name: Run TypeScript check and production bundle build
        run: |
          npm --prefix frontend run build
