name: Veritas CI — Full Test Suite & Build Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Backend — All 12 automated test suites (zero Gemini API credits)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend — Full Test Suite (12 suites, mock mode)
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "test"
      VERITAS_TEST_MODE: "true"
      VERITAS_MOCK_LLM: "true"
      SESSION_SECRET_KEY: "veritas_ci_test_secret_key_fixed_length_minimum_32_bytes!!"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify dependency resolution integrity
        run: pip check

      # Single step runs all 12 suites via the project's own master test runner.
      # Any test added to run_all_tests.py is automatically included in CI —
      # no need to update this workflow file.
      - name: Run all 12 test suites via run_all_tests.py
        working-directory: backend
        run: python run_all_tests.py

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-failure-logs
          path: backend/*.log
          if-no-files-found: ignore
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Frontend — Lint + TypeScript + Production Build
# Only runs after backend passes (saves CI minutes on broken backends)
# ─────────────────────────────────────────────────────────────────────────────
  frontend-validation:
    name: Frontend — Lint & Production Build
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run linter (oxlint)
        run: npm --prefix frontend run lint

      - name: TypeScript check and production build
        run: npm --prefix frontend run build
