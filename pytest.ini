[pytest]
testpaths = backend
pythonpath = . backend
addopts = --disable-warnings -p no:warnings
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning
    ignore:Module already imported so cannot be rewritten.*:pytest.PytestAssertRewriteWarning
    ignore:Module already imported so cannot be rewritten; anyio:pytest.PytestAssertRewriteWarning
    ignore:Module already imported so cannot be rewritten; langsmith:pytest.PytestAssertRewriteWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
